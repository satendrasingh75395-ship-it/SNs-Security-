

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNs Security</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:20px}
.card{max-width:420px;margin:50px auto;background:#1e293b;padding:24px;border-radius:20px;text-align:center}
h1{color:#38bdf8}
input,button{width:100%;padding:14px;margin-top:14px;box-sizing:border-box;border-radius:10px;font-size:16px}
input{background:#0f172a;color:white;border:1px solid #475569}
button{background:#0284c7;color:white;border:0}
.note{color:#cbd5e1;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>SNs Security</h1>
<p>आपकी निजी सुरक्षा के लिए</p>
<section id="welcome">
<p>आपका स्वागत है</p>
<button onclick="showLogin()">शुरू करें</button>
</section>
<section id="login" hidden>
<h2>लॉगिन / रजिस्टर</h2>
<p class="note">अपना मोबाइल नंबर डालें। यह अभी डेमो स्क्रीन है।</p>
<input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर">
<button onclick="continueLogin()">आगे बढ़ें</button>
<button onclick="goBack()">वापस जाएँ</button>
<p id="message" class="note"></p>
</section>
</div>
<script>
function showLogin(){
 document.getElementById('welcome').hidden=true;
 document.getElementById('login').hidden=false;
}
function goBack(){
 document.getElementById('login').hidden=true;
 document.getElementById('welcome').hidden=false;
}
function continueLogin(){
 const phone=document.getElementById('phone').value.trim();
 const message=document.getElementById('message');
 if(!/^[6-9][0-9]{9}$/.test(phone)){
  message.textContent='कृपया सही 10 अंकों का भारतीय मोबाइल नंबर डालें।';
  return;
 }
 message.textContent='स्क्रीन तैयार है। असली OTP लॉगिन के लिए Firebase सेटअप करना बाकी है।';
}
</script>
</body>
</html>
